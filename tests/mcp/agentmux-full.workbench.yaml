apiVersion: mcp-workbench.dev/v0alpha1
server:
  transport: stdio
  command: target/debug/agentmux.exe
  args:
    - mcp
    - serve
    - --profile
    - full
client:
  protocolVersion: "2025-11-25"
tests:
  - id: full-profile-tools
    description: Full profile exposes the complete AgentMux tool and schema contract
    act:
      method: tools/list
    assert:
      - kind: status
        equals: success
      - kind: count
        path: $.tools
        equals: 73
      - kind: contains
        path: $.tools[*].name
        value: agent_worker_list
      - kind: contains
        path: $.tools[*].name
        value: agent_integration_status
      - kind: contains
        path: $.tools[*].name
        value: agent_worker_start
      - kind: contains
        path: $.tools[*].name
        value: agent_team_start
      - kind: contains
        path: $.tools[*].name
        value: agent_team_list
      - kind: contains
        path: $.tools[*].name
        value: agent_team_spawn
      - kind: contains
        path: $.tools[*].name
        value: agent_team_release
      - kind: contains
        path: $.tools[*].name
        value: agent_team_reflow
      - kind: contains
        path: $.tools[*].name
        value: agent_worker_send
      - kind: contains
        path: $.tools[*].name
        value: agent_worker_stop
      - kind: contains
        path: $.tools[*].name
        value: agent_integration_setup
      - kind: contains
        path: $.tools[*].name
        value: git_commit
      - kind: contains
        path: $.tools[*].name
        value: git_stage_all
      - kind: contains
        path: $.tools[*].name
        value: git_discard
      - kind: contains
        path: $.tools[*].name
        value: agent_worktree_remove
      - kind: contains
        path: $.tools[*].name
        value: git_review_thread_deliver
      - kind: contains
        path: $.tools[*].name
        value: git_review_comment_delete
      - kind: contains
        path: $.tools[*].name
        value: markdown_read
      - kind: contains
        path: $.tools[*].name
        value: markdown_open
      - kind: count
        path: $.tools[*].inputSchema.$defs.AgentWorkerKindParam.enum
        equals: 5
      - kind: contains
        path: $.tools[*].inputSchema.$defs.AgentWorkerKindParam.enum
        value: codex-pane
      - kind: contains
        path: $.tools[*].annotations.openWorldHint
        value: true
