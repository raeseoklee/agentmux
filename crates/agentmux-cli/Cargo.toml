[package]
name = "agentmux-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
agentmux-backend = { path = "../agentmux-backend" }
agentmux-backend-conpty = { path = "../agentmux-backend-conpty" }
agentmux-backend-wsl = { path = "../agentmux-backend-wsl" }
agentmux-core = { path = "../agentmux-core" }
agentmux-ipc = { path = "../agentmux-ipc" }
agentmux-vcs = { path = "../agentmux-vcs" }
serde = "1"
serde_json = "1"
tungstenite = "0.24"
getrandom = "0.2"
rmcp = { version = "=2.2.0", default-features = false, features = ["macros", "server", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
axum = { version = "0.8", features = ["http1", "tokio"] }
bytes = "1"
http = "1"
http-body-util = "0.1"
tower-service = "0.3"

[[bin]]
name = "agentmux"
path = "src/main.rs"

[[bin]]
name = "cmux"
path = "src/cmux.rs"
