[package]
name = "agentmux-desktop-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
agentmux-backend = { path = "../../../crates/agentmux-backend" }
agentmux-backend-conpty = { path = "../../../crates/agentmux-backend-conpty" }
agentmux-backend-ssh = { path = "../../../crates/agentmux-backend-ssh" }
agentmux-backend-tmux = { path = "../../../crates/agentmux-backend-tmux" }
agentmux-backend-wsl = { path = "../../../crates/agentmux-backend-wsl" }
agentmux-browser = { path = "../../../crates/agentmux-browser" }
agentmux-core = { path = "../../../crates/agentmux-core" }
agentmux-ipc = { path = "../../../crates/agentmux-ipc" }
agentmux-store = { path = "../../../crates/agentmux-store" }
agentmux-vcs = { path = "../../../crates/agentmux-vcs" }
base64 = "0.22"
getrandom = "0.2"
serde = "1"
serde_json = "1"
same-file = "1"
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
arboard = "3.6.1"
image = { version = "0.25", default-features = false, features = ["png"] }
notify-rust = "4.18"
webview2-com = "0.38"
windows-core = "0.61"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }

[dev-dependencies]

[build-dependencies]
tauri-build = { version = "2", features = [] }
